packages:
  - 'frontend'
  - 'backend'

overrides:
  # firebase-functions pulls in @types/express@4 transitively, which conflicts
  # with our own @types/express@^5 (backend uses Express 5) and causes
  # environment-dependent type errors depending on how pnpm hoists the two
  # versions. Force one version everywhere.
  '@types/express': '^5.0.1'
  # next@16.2.12 still bundles its own old postcss internally (separate from
  # the patched one Tailwind/Vite already use) — force it to a patched
  # version too. postcss 8.x is backward-compatible within the major.
  postcss: '^8.5.18'
  # next also bundles an old sharp (image optimization) — force the patched line.
  sharp: '0.35.5'
  # js-yaml (CVE-2026-59870) and nanoid highs from `pnpm audit` — patched here.
  js-yaml: '^4.3.2'
  nanoid: '^3.3.18'
  # Patched within each existing major for the minimatch chains used by
  # ESLint, TypeScript ESLint and Vitest coverage.
  'minimatch@3>brace-expansion': '1.1.21'
  'minimatch@9>brace-expansion': '2.1.7'
  'minimatch@10>brace-expansion': '5.0.12'
  # Firestore reaches grpc-js through google-gax; keep the override scoped to
  # that parent-child edge and on the existing compatible release line.
  'google-gax>@grpc/grpc-js': '1.14.5'
  # Compatible security fixes; keep existing parent release lines.
  'firebase-admin@13>@fastify/busboy': '3.2.2'
  'postcss@8>source-map-js': '1.2.2'
  'magicast@0.3.5>source-map-js': '1.2.2'
  '@tailwindcss/node@4>source-map-js': '1.2.2'
  'express@4>proxy-addr': '2.0.8'
  'express@5>proxy-addr': '2.0.8'
  'express-rate-limit@8>ip-address': '10.7.1'

allowBuilds:
  '@firebase/util': true
  # postinstall only copies silent-check-sso.html into public/ — we add that file
  # by hand (see frontend/public/), so the script is not needed. See the Tide
  # learning log (ISSUE: @tidecloak/js postinstall vs pnpm build-script policy).
  '@tidecloak/js': false
  esbuild: true
  lefthook: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
